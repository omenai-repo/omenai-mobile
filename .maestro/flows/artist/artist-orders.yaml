appId: com.omenai.omenaimobile
name: "Artist Orders Screen"
tags:
  - artist
  - orders
  - smoke

---
- runFlow: ../login/artist-login.yaml

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- tapOn: "Orders"

- extendedWaitUntil:
    visible: "Orders"
    timeout: 10000

- assertVisible: "Order History"
- assertVisible: "All Status"

- tapOn: "Order History"
- assertVisible: "Order History"
- assertVisible: "All Status"

- tapOn:
    text: "Orders"
    index: 0

- assertVisible: "All Status"

- extendedWaitUntil:
    visible:
      anyOf:
        - "Pending"
        - "No orders"
        - "All Status"
    timeout: 10000
