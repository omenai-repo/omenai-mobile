appId: com.omenai.omenaimobile
name: "Artist Profile Screen"
tags:
  - artist
  - profile
  - smoke

---
- runFlow: ../login/artist-login.yaml

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- tapOn: "Profile"

- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 10000

- assertVisible: "Edit profile"
- assertVisible: "Edit your credentials"
- assertVisible: "View Credentials"

- scrollUntilVisible:
    direction: DOWN
    element:
      anyOf:
        - "Change password"
        - "Biometric Login"
    timeout: 10000

- scrollUntilVisible:
    direction: DOWN
    element: "Delete account"
    timeout: 10000

- assertVisible: "Delete account"
