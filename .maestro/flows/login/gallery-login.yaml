appId: com.omenai.omenaimobile
name: "Gallery User Login"
tags:
  - login
  - gallery
  - auth

---

- launchApp:
    clearState: true

# Dismiss Expo developer menu if it appears
- tapOn:
    text: "Continue"
    optional: true

- assertVisible: "Welcome"
- tapOn: "Login"

- assertVisible: "Welcome Back"
- tapOn: "Gallery"

- tapOn: "Email address"
- inputText: "dantereus1@gmail.com"
- hideKeyboard

- tapOn: "Password"
- inputText: "Test12345@"
- hideKeyboard

- tapOn: "Log In"

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- assertVisible: "Artworks"
