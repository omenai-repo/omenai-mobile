appId: com.omenai.omenaimobile
name: "Welcome Screen - Skip Onboarding (First Time)"
tags:
  - welcome
  - onboarding
  - auth

---
- stopApp: com.omenai.omenaimobile
- launchApp:
    clearState: true

# Select the development server after state is cleared
- extendedWaitUntil:
    visible: "http://localhost:8081"
    timeout: 10000
- tapOn: "http://localhost:8081"

# Wait a moment for app to load or Developer Menu to appear (using swipe hack)
- swipe:
    start: 50%,10%
    end: 50%,10%
    duration: 7000

- swipe:
    start: 50%,10%
    end: 50%,10%
    duration: 7000

# Onboarding Page 1
- extendedWaitUntil:
    visible: "Contemporary African Art, Curated"
    timeout: 10000

- tapOn: "Skip"

# Welcome Screen should appear immediately after skip
- extendedWaitUntil:
    visible: "Build Your Art World"
    timeout: 5000

- assertVisible: "Create Account"
- assertVisible: "Log In"
