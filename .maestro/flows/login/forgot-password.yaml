appId: com.omenai.omenaimobile
name: "Forgot Password Flow"
tags:
  - login
  - forgot-password
  - auth

---
- runFlow: welcome-onboarding-skip.yaml

- tapOn: "Log In"
- assertVisible: "Welcome Back"

- tapOn: "Forgot password? Click here"

- extendedWaitUntil:
    visible:
      anyOf:
        - "Forgot"
        - "Reset"
        - "Recovery"
    timeout: 5000

- tapOn:
    anyOf:
      - "Email"
      - "Email address"
- inputText: "dantereus1@gmail.com"
- hideKeyboard

- tapOn:
    anyOf:
      - "Send"
      - "Submit"
      - "Continue"
      - "Reset"

- extendedWaitUntil:
    visible:
      anyOf:
        - "OTP"
        - "Check your email"
        - "sent"
        - "Verification"
    timeout: 15000
