appId: com.omenai.omenaimobile
name: "Artist User Login"
tags:
  - login
  - artist
  - auth

---
- runFlow: welcome-onboarding-skip.yaml

- tapOn: "Log In"

- assertVisible: "Welcome Back"
- tapOn: "Artist"

- tapOn:
    id: "login-email-input"
- inputText: "dantereus1@gmail.com"
- hideKeyboard

- tapOn:
    id: "login-password-input"
- inputText: "Test12345@"
- hideKeyboard

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- assertVisible: "Overview"
