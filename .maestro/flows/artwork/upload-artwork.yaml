appId: com.omenai.omenaimobile
name: "Upload Artwork Flow"
tags:
  - artwork
  - upload
  - gallery

---
# This flow assumes a logged-in Gallery or Artist user
- runFlow: ../login/gallery-login.yaml

# Wait for overview to load
- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

# Tap the Artworks tab
- tapOn: "Artworks"

# Tap Upload artwork
- extendedWaitUntil:
    visible: "Upload artwork"
    timeout: 10000
- tapOn: "Upload artwork"

# 1. Artwork Details
- assertVisible: "Artwork Details"
- tapOn: "Enter the name of your artwork"
- inputText: "Maestro Test Masterpiece"
- hideKeyboard

- tapOn: "Write a description of your artwork"
- inputText: "A beautiful masterpiece created during Maestro E2E test."
- hideKeyboard

- tapOn: "Select medium"
- tapOn: "Photography"

- tapOn: "Enter the materials used"
- inputText: "Digital, Camera"
- hideKeyboard

- tapOn: "Enter year of creation"
- inputText: "2026"
- hideKeyboard

- tapOn: "Select rarity"
- tapOn: "Unique"

- scrollUntilVisible:
    direction: DOWN
    element: "Proceed"

- tapOn: "Select" # Certificate of authenticity
- tapOn: "Yes"

- tapOn: "Select" # Signature
- tapOn: "By artist"

- tapOn: "Proceed"

# 2. Artwork Dimensions
- assertVisible: "Artwork Dimensions"
- tapOn: "Length (in)"
- inputText: "24"
- hideKeyboard

- tapOn: "Height (in)"
- inputText: "36"
- hideKeyboard

- scrollUntilVisible:
    direction: DOWN
    element: "Proceed"
- tapOn: "Proceed"

# 3. Artwork Shipping
- assertVisible: "Shipping Configuration"
- tapOn: "Rolled" # Default OR selection
- scrollUntilVisible:
    direction: DOWN
    element: "Proceed"
- tapOn: "Proceed"

# 4. Pricing (Assuming Gallery)
- assertVisible: "Currency"
- tapOn: "Select" # Currency
- tapOn: "USD"

- tapOn: "Enter your price"
- inputText: "1000"
- hideKeyboard

# Convert button (tapping sync icon using nearby text or index)
- tapOn: "Price" # To ensure we are near it, but tapping sync requires accurate targeting in maestro

- scrollUntilVisible:
    direction: DOWN
    element: "Proceed"
- tapOn: "Proceed"
# 5. Artist Details
- assertVisible: "Artist full name"
# If user is Gallery:
- tapOn: "Enter artist full name"
- inputText: "Maestro Painted"
- hideKeyboard

- tapOn: "Enter artist birth year"
- inputText: "1980"
- hideKeyboard

- tapOn: "Select country"
- tapOn: "Search country"
- inputText: "United States"
- tapOn: "United States" # select it
- hideKeyboard

- scrollUntilVisible:
    direction: DOWN
    element: "Proceed"
- tapOn: "Proceed"

# 6. Upload Image & Success
# (Upload image steps to be finalized based on components)
- tapOn: "Upload Image"
- tapOn: "Upload artwork"

# 7. Check Success Screen
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- tapOn: "Done"
