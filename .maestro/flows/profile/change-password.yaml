appId: com.omenai.omenaimobile
name: "Change Password Flow"
tags:
  - individual
  - profile
  - change-password
  - auth

---
- runFlow: ../login/individual-login.yaml

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- tapOn: "More"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 5000
- tapOn: "Profile"

- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 10000

- scrollUntilVisible:
    direction: DOWN
    element: "Change password"
    timeout: 10000
- tapOn: "Change password"

- extendedWaitUntil:
    visible:
      anyOf:
        - "Change Password"
        - "Current password"
        - "Old password"
    timeout: 10000

- tapOn:
    anyOf:
      - "Current password"
      - "Old password"
- inputText: "Test12345@"
- hideKeyboard

- tapOn:
    anyOf:
      - "New password"
      - "New Password"
- inputText: "NewTest12345@"
- hideKeyboard

- tapOn:
    anyOf:
      - "Confirm"
      - "Confirm new password"
- inputText: "NewTest12345@"
- hideKeyboard

- tapOn:
    anyOf:
      - "Update"
      - "Save"
      - "Change"

- extendedWaitUntil:
    visible:
      anyOf:
        - "Password updated"
        - "successfully"
        - "Profile"
    timeout: 15000
