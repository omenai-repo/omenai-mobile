appId: com.omenai.omenaimobile
name: "Save Artwork Flow"
tags:
  - artwork
  - save
  - discovery

---
- runFlow: ../login/individual-login.yaml

- extendedWaitUntil:
    visible: "Trending"
    timeout: 20000

- tapOn: "Trending"
- swipe:
    direction: UP
    duration: 1000

- tapOn:
    id: ".*heart.*"

- tapOn: "More"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 5000
- tapOn: "Profile"

- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 10000
- tapOn: "Saved artworks"

- extendedWaitUntil:
    visible: "Saved artworks"
    timeout: 10000

- extendedWaitUntil:
    visible:
      anyOf:
        - "artworks saved"
        - "No saved artworks"
        - "Tap the heart on any artwork to save it here."
    timeout: 15000
