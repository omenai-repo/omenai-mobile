appId: com.omenai.omenaimobile
name: "Individual Logout Flow"
tags:
  - individual
  - logout
  - auth

---
- runFlow: ../login/individual-login.yaml

- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000

- tapOn: "More"

- extendedWaitUntil:
    visible: "Logout"
    timeout: 5000
- tapOn: "Logout"

- extendedWaitUntil:
    visible:
      anyOf:
        - "Build Your Art World"
        - "Log In"
        - "Create Account"
    timeout: 15000

- assertVisible: "Log In"
- assertVisible: "Create Account"
